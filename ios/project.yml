name: ReadLater
options:
  bundleIdPrefix: com.onevalar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 开发者团队 ID（来自本机钥匙串里的签名证书）；换账号时在这里或 Xcode 的 Signing 里改。
    DEVELOPMENT_TEAM: "H4982D35ZR"
targets:
  ReadLater:
    type: application
    platform: iOS
    sources:
      - ReadLater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onevalar.readlater
        PRODUCT_NAME: ReadLater
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Read Later
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ReadLaterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReadLaterTests
    dependencies:
      - target: ReadLater
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.onevalar.readlater.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReadLater.app/ReadLater"
        BUNDLE_LOADER: "$(TEST_HOST)"
